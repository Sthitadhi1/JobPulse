services:
  - type: web
    name: jobpulse
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.8
      - key: ENABLE_SCHEDULER
        value: "true"
      - key: ALLOWED_ORIGINS
        value: "*"
      - key: SCHEDULER_SECRET
        generateValue: true
      # Set in the Render dashboard: comma-separated admin account emails.
      - key: ADMIN_EMAILS
        sync: false
