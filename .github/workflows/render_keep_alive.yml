name: Render 24/7 Keep-Alive

on:
  schedule:
    # Run every 10 minutes to prevent Render free instance from spinning down
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping-render:
    runs-on: ubuntu-latest
    steps:
      - name: Ping JobPulse Render URL
        run: |
          RENDER_URL="https://jobpulse-2z2f.onrender.com/api/v1/health"
          echo "Pinging $RENDER_URL..."
          curl -s -f -m 30 "$RENDER_URL" || echo "Ping dispatched"
