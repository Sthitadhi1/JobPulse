name: JobPulse Automated Discovery & Ghost Job Pruning

on:
  schedule:
    # Runs every 2 hours (0 */2 * * *)
    - cron: '0 */2 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI
    inputs:
      mode:
        description: 'Execution Mode'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - discover
          - verify

jobs:
  jobpulse-crawler-pipeline:
    name: Crawl Active Jobs & Remove Ghost/Dead Listings
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install httpx beautifulsoup4 sqlalchemy aiosqlite pydantic pydantic-settings PyPDF2

      - name: Run Job Discovery & Dead-Link Verification Worker
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL || 'sqlite+aiosqlite:///./jobpulse.db' }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          ENABLE_SCHEDULER: 'false'
        run: |
          MODE="${{ github.event.inputs.mode || 'all' }}"
          echo "Executing JobPulse worker with mode: $MODE"
          python -m backend.run_worker --mode=$MODE --concurrency=35

      - name: Commit and Push Updated SQLite DB (If using SQLite repository storage)
        if: env.DATABASE_URL == 'sqlite+aiosqlite:///./jobpulse.db'
        run: |
          git config --global user.name "JobPulse Bot"
          git config --global user.email "bot@jobpulse.local"
          git add jobpulse.db*
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(data): auto-update active job index [skip ci]" && git push)
