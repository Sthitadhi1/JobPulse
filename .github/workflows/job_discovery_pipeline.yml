name: JobPulse Automated Discovery & Ghost Job Pruning

on:
  schedule:
    # Runs every 2 hours (0 */2 * * *)
    - cron: '0 */2 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI
    inputs:
      mode:
        description: 'Execution Mode'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - discover
          - verify

permissions:
  contents: read

jobs:
  jobpulse-crawler-pipeline:
    name: Crawl Active Jobs & Remove Ghost/Dead Listings
    # Only the upstream repository crawls on a schedule; forks can still run it manually.
    if: github.repository == 'Sthitadhi1/JobPulse' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Job Discovery & Dead-Link Verification Worker
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          ENABLE_SCHEDULER: 'false'
          MODE: ${{ github.event.inputs.mode || 'all' }}
        run: |
          # Results only matter when they land in a shared database. Without a DATABASE_URL
          # secret the crawl would write to a throwaway SQLite file, so skip it.
          if [ -z "$DATABASE_URL" ]; then
            echo "::notice::DATABASE_URL secret is not set; skipping crawl. Add it in Settings > Secrets to enable scheduled crawling."
            exit 0
          fi
          echo "Executing JobPulse worker with mode: $MODE"
          python -m backend.run_worker --mode="$MODE" --concurrency=35
